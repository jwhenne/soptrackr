  </defs>
  <!-- Automotive shield/badge with subtle gear teeth -->
  <path d="M32 3 L56 11 L56 35 C56 47 46 56 32 61 C18 56 8 47 8 35 L8 11 Z" fill="url(#stbg)" stroke="#0B1B3A" stroke-width="1"/>
