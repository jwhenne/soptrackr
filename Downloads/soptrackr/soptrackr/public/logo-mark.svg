    <line x1="19.2" y1="44.8" x2="16.4" y2="47.6"/>
  </g>
  <!-- Wrench forming a stylized "S" with tracking pulse at tip -->
  <path d="M40 20 C36 18 30 19 28 23 C26 27 28 31 32 32 C36 33 40 35 40 39 C40 43 35 46 30 45 C26 44 23 41 23 38"
